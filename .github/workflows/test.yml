name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Workbook Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Validate shared parameters
        run: node scripts/validate-shared-params.js

      - name: Build and validate gallery package
        run: |
          node scripts/build-gallery.js
          node scripts/validate-gallery.js

      - name: Verify monolithic artifact is up-to-date
        run: node scripts/build-monolithic.js --check

      - name: Lint accessibility (inline-style HTML)
        run: node scripts/lint-accessibility.js

      - name: Run unit tests
        run: node scripts/run-tests.js

      - name: Write test summary
        if: always()
        run: node scripts/generate-summary.js >> $GITHUB_STEP_SUMMARY

      - name: Upload NUnit test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: test-results/nunit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: test-results/nunit.xml
          check_name: 'Workbook Unit Tests'
          comment_mode: 'off'
          report_individual_runs: 'true'
          report_suite_logs: 'info'
          check_run_annotations: 'all tests, skipped tests'
